# Render Blueprint: Django API (free web service) + React SPA (static site).
# Postgres is hosted on Neon (free); paste its DIRECT connection string into DATABASE_URL.
#
# Values marked `sync: false` are entered once in the Render dashboard (never committed):
#   api: DATABASE_URL, CORS_ALLOWED_ORIGINS (= https://<web service>.onrender.com)
#   web: VITE_API_URL (= https://<api service>.onrender.com)
#
# Migrations run in the build step (pre-deploy commands are not available on the free plan).
# They therefore reach the live database before the new code is serving, so migrations in
# this project must stay additive / backward-compatible (see docs/ARCHITECTURE.md).
services:
  - type: web
    name: ajaia-docs-api
    runtime: python
    plan: free
    region: ohio  # same AWS region as the Neon database (us-east-2)
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py migrate --plan &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: ajaia-docs-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
